<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>月飼い - Keeping the Moon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      /* iOS Safari の URL バー出入りで高さが変わるため dvh を使う */
      height: 100dvh;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
    }
    #container { width: 100%; height: 100%; }
    canvas { display: block; }
    #title {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.5em;
      pointer-events: none;
      z-index: 100;
      opacity: 1;
      transition: opacity 3s ease;
    }
    #title.hidden { opacity: 0; }
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.2em;
      pointer-events: none;
      z-index: 100;
      opacity: 1;
      transition: opacity 2s ease;
    }
    #hint.hidden { opacity: 0; }
    #credits {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.6;
      text-align: right;
      pointer-events: none;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.8s ease;
    }
    #credits.hidden { opacity: 0; }
    #credits a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      pointer-events: auto;
      transition: color 0.3s ease;
    }
    #credits a:hover {
      color: rgba(255, 255, 255, 0.8);
    }
    #credits-area {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 120px;
      height: 120px;
      z-index: 101;
    }
    #credits-area:hover ~ #credits,
    #credits-area:hover ~ #credits.hidden {
      opacity: 0.7;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="title">月 飼 い</div>
  <div id="hint">水面に触れてみてください</div>
  <div id="credits-area"></div>
  <div id="credits">
    Moon texture: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a><br>
    Repository: <a href="https://github.com/clockcrockwork/moon-keeper" target="_blank" rel="noopener">moon-keeper</a>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
